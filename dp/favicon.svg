<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      .js-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 280px;
        letter-spacing: -10px;
        fill: #FFFFFF;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- iOS Liquid Glass Squircle Container -->
  <rect width="512" height="512" rx="112" fill="#0C0B14"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="12"/>

  <!-- Brand Monogram "JS" (Centered, No Dot) -->
  <text x="256" y="356" class="js-text">JS</text>
</svg>
